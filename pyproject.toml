[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inverse-kgqa-verifier"
version = "0.1.0"
description = "Inverse path-to-question verification experiments for multi-hop KGQA"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "sentence-transformers>=3.0",
  "torch>=2.1",
  "transformers>=4.40",
]

[project.optional-dependencies]
test = ["pytest>=8"]
retrieval = ["srtk==0.0.7"]

[tool.setuptools]
packages = ["inverse_verifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
